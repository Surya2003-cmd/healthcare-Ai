{% extends "base.html" %}

{% block title %}
Disease Prediction
{% endblock %}

{% block page_title %}
Disease Prediction
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <!-- Diabetes Prediction -->

        <div class="col-lg-6">

            <div class="card-box">

                <h3 class="text-primary mb-4">

                    <i class="bi bi-droplet-half"></i>

                    Diabetes Prediction

                </h3>

                <form action="/predict_diabetes" method="POST">

                    <div class="mb-3">
                        <label>Pregnancies</label>
                        <input type="number" class="form-control" name="pregnancies" required>
                    </div>

                    <div class="mb-3">
                        <label>Glucose</label>
                        <input type="number" class="form-control" name="glucose" required>
                    </div>

                    <div class="mb-3">
                        <label>Blood Pressure</label>
                        <input type="number" class="form-control" name="bloodpressure" required>
                    </div>

                    <div class="mb-3">
                        <label>Skin Thickness</label>
                        <input type="number" class="form-control" name="skinthickness" required>
                    </div>

                    <div class="mb-3">
                        <label>Insulin</label>
                        <input type="number" class="form-control" name="insulin" required>
                    </div>

                    <div class="mb-3">
                        <label>BMI</label>
                        <input type="number" step="0.01" class="form-control" name="bmi" required>
                    </div>

                    <div class="mb-3">
                        <label>Diabetes Pedigree Function</label>
                        <input type="number" step="0.001" class="form-control" name="dpf" required>
                    </div>

                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" class="form-control" name="age" required>
                    </div>

                    <button class="btn btn-primary w-100">

                        Predict Diabetes

                    </button>

                </form>

            </div>

        </div>

        <!-- Heart Disease Prediction -->

        <div class="col-lg-6">

            <div class="card-box">

                <h3 class="text-danger mb-4">

                    <i class="bi bi-heart-pulse-fill"></i>

                    Heart Disease Prediction

                </h3>

                <form action="/predict_heart" method="POST">

                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" class="form-control" name="age" required>
                    </div>

                    <div class="mb-3">
                        <label>Sex (1=Male,0=Female)</label>
                        <input type="number" class="form-control" name="sex" required>
                    </div>

                    <div class="mb-3">
                        <label>Chest Pain Type</label>
                        <input type="number" class="form-control" name="cp" required>
                    </div>

                    <div class="mb-3">
                        <label>Resting Blood Pressure</label>
                        <input type="number" class="form-control" name="trestbps" required>
                    </div>

                    <div class="mb-3">
                        <label>Cholesterol</label>
                        <input type="number" class="form-control" name="chol" required>
                    </div>

                    <div class="mb-3">
                        <label>Fasting Blood Sugar</label>
                        <input type="number" class="form-control" name="fbs" required>
                    </div>

                    <div class="mb-3">
                        <label>Rest ECG</label>
                        <input type="number" class="form-control" name="restecg" required>
                    </div>

                    <div class="mb-3">
                        <label>Maximum Heart Rate</label>
                        <input type="number" class="form-control" name="thalach" required>
                    </div>

                    <div class="mb-3">
                        <label>Exercise Induced Angina</label>
                        <input type="number" class="form-control" name="exang" required>
                    </div>

                    <div class="mb-3">
                        <label>Old Peak</label>
                        <input type="number" step="0.1" class="form-control" name="oldpeak" required>
                    </div>

                    <div class="mb-3">
                        <label>Slope</label>
                        <input type="number" class="form-control" name="slope" required>
                    </div>

                    <div class="mb-3">
                        <label>CA</label>
                        <input type="number" class="form-control" name="ca" required>
                    </div>

                    <div class="mb-3">
                        <label>Thal</label>
                        <input type="number" class="form-control" name="thal" required>
                    </div>

                    <button class="btn btn-danger w-100">

                        Predict Heart Disease

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
