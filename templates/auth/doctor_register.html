
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Registration</title>
</head>
<body>

<h2>Doctor Registration</h2>

<form action="/doctor_register_submit" method="POST">

    <input type="text"
           name="doctor_name"
           placeholder="Doctor Name"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a href="/doctor_login">
    Already Registered? Login
</a>

</body>
</html>
