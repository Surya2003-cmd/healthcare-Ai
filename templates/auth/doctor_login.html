```html
{% extends "base.html" %}

{% block title %}
Doctor Login
{% endblock %}

{% block page_title %}
Doctor Login
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center">

    <div class="col-lg-5 col-md-7">

        <div class="card-box">

            <div class="text-center mb-4">

                <i class="bi bi-person-badge-fill text-primary"
                   style="font-size:70px;"></i>

                <h2 class="fw-bold mt-3">

                    Doctor Login

                </h2>

                <p class="text-muted">

                    Sign in to access the Doctor Dashboard

                </p>

            </div>

            <form action="/doctor_login_submit" method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Doctor Email

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope-fill"></i>

                        </span>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter doctor email"
                            required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Password

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Enter password"
                            required>

                    </div>

                </div>

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Doctor Login

                    </button>

                </div>

            </form>

            <hr>

            <div class="text-center">

                <p>

                    New Doctor?

                    <a href="/doctor_register">

                        Register Here

                    </a>

                </p>

                <p>

                    User Login?

                    <a href="/">

                        Click Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
