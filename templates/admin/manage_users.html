{% extends "base.html" %}

{% block title %}
Manage Users
{% endblock %}

{% block page_title %}
Registered Users
{% endblock %}

{% block content %}

<div class="card-box">

<h2>

Registered Users

</h2>

<hr>

<div class="table-responsive">

<table class="table table-striped table-bordered">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Full Name</th>

<th>Email</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user[0] }}</td>

<td>{{ user[1] }}</td>

<td>{{ user[2] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<a href="/admin"
class="btn btn-primary">

Back to Dashboard

</a>

</div>

{% endblock %}
