{% extends "base.html" %}

{% block title %}
Add Recommendation
{% endblock %}

{% block page_title %}
Medical Recommendation
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card-box">

                <div class="text-center mb-4">

                    <i class="bi bi-heart-pulse-fill text-danger"
                       style="font-size:70px;"></i>

                    <h2 class="mt-3">

                        Doctor Recommendation

                    </h2>

                    <p class="text-muted">

                        Provide personalized medical advice for your patient.

                    </p>

                </div>

                <form action="/save_recommendation" method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Patient Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="patient"
                            placeholder="Enter Patient Name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Disease

                        </label>

                        <select
                            class="form-select"
                            name="disease"
                            required>

                            <option value="">Select Disease</option>

                            <option>Diabetes</option>

                            <option>Heart Disease</option>

                            <option>Hypertension</option>

                            <option>Back Pain</option>

                            <option>Neck Pain</option>

                            <option>Knee Pain</option>

                            <option>General Health</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Medicines

                        </label>

                        <textarea
                            class="form-control"
                            name="medicine"
                            rows="3"
                            placeholder="Enter prescribed medicines"></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Diet Recommendation

                        </label>

                        <textarea
                            class="form-control"
                            name="diet"
                            rows="3"
                            placeholder="Enter diet recommendation"></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Physiotherapy Recommendation

                        </label>

                        <textarea
                            class="form-control"
                            name="physiotherapy"
                            rows="3"
                            placeholder="Enter physiotherapy recommendation"></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Additional Recommendation

                        </label>

                        <textarea
                            class="form-control"
                            name="recommendation"
                            rows="5"
                            placeholder="Enter complete medical recommendation"
                            required></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <button
                                class="btn btn-success w-100"
                                type="submit">

                                <i class="bi bi-check-circle-fill"></i>

                                Save Recommendation

                            </button>

                        </div>

                        <div class="col-md-6">

                            <a href="/doctor"
                               class="btn btn-secondary w-100">

                                <i class="bi bi-arrow-left-circle-fill"></i>

                                Back

                            </a>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
